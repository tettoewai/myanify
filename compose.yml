name: myanify

# VPS reads ./​.env for ${VAR} interpolation AND as the app's runtime env.
# Required in .env: DATABASE_URL, AUTH_SECRET, all GOOGLE_*/CLOUDINARY_*/
# UPSTASH_*/TYPESENSE_*/RESEND_*/RELEASE_* vars (copy via `vercel env pull`),
# plus API_HOST (public hostname, e.g. api.example.com or api.1-2-3-4.sslip.io)
# and NEXT_PUBLIC_APP_URL=https://<API_HOST>.

services:
  app:
    build:
      context: .
      args:
        DATABASE_URL: ${DATABASE_URL}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
    env_file:
      - .env
    environment:
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
    expose:
      - "3000"
    # Localhost-only publish: system nginx (pawn-shop) owns 80/443 and
    # reverse-proxies to 127.0.0.1:3000. Never expose 3000 publicly.
    ports:
      - "127.0.0.1:3000:3000"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

name: Deploy backend to VPS
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'lib/**'
      - 'prisma/**'
      - 'public/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'Dockerfile'
      - 'compose.yml'
      - 'next.config.mjs'
      - 'auth*.ts'
      - 'proxy.ts'
      - 'db.ts'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/tettoewai/myanify:latest
          build-args: NEXT_PUBLIC_APP_URL=https://api.18-138-227-206.sslip.io
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Pull image, migrate, deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 30m
          script: |
            cd ~/myanify
            docker compose pull
            docker compose up -d --force-recreate
            sleep 20
            docker compose exec -T app pnpm exec prisma migrate deploy
            curl -sf -o /dev/null https://api.18-138-227-206.sslip.io/api/health

name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Pull image, migrate, deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 30m
          script: |
            cd ~/myanify
            docker compose pull
            docker compose up -d --force-recreate
            sleep 20
            docker compose exec -T app pnpm exec prisma migrate deploy
            # Drop the previous release image (now dangling) so VPS disk
            # doesn't fill up over successive deploys. Only removes
            # untagged images, never anything in use.
            docker image prune -f

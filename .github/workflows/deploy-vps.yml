name: Deploy backend to VPS
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'lib/**'
      - 'prisma/**'
      - 'public/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'Dockerfile'
      - 'compose.yml'
      - 'next.config.mjs'
      - 'auth*.ts'
      - 'proxy.ts'
      - 'db.ts'
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Pull image, migrate, deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 30m
          script: |
            cd ~/myanify
            docker compose pull app
            docker compose up -d --no-build --remove-orphans
            sleep 20
            docker compose exec -T app pnpm exec prisma migrate deploy
            curl -sf -o /dev/null https://api.18-138-227-206.sslip.io/api/health

name: mobile-manifest

on:
  push:
    paths:
      - "mobile-release.json"
      - "lib/mobile-release.ts"
      - "app/api/mobile-update/**"
      - "scripts/**"
  pull_request:
    paths:
      - "mobile-release.json"
      - "lib/mobile-release.ts"
      - "app/api/mobile-update/**"
      - "scripts/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm dlx tsx scripts/validate-manifest.ts
